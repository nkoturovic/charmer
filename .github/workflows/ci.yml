# Temporary diagnostic harness only; never merge this branch into canonical CI.
# Collect ARM caller metadata only; do not execute qualification workloads.
name: ARM caller metadata

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: charmer-native-arm-caller-metadata
  cancel-in-progress: false

jobs:
  metadata:
    name: ARM caller metadata
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 81a266801b11569e6e8873ddebed16eb1d162356
          persist-credentials: false
      - name: Bind product HEAD and separately record workflow identity
        shell: bash
        run: |
          umask 077
          product_source_sha="$(git rev-parse --verify HEAD 2>/dev/null)" || {
            printf '%s\n' '::error::product source binding unavailable'
            exit 1
          }
          if [[ "$product_source_sha" != 81a266801b11569e6e8873ddebed16eb1d162356 ]]; then
            printf '%s\n' '::error::product source binding mismatch'
            exit 1
          fi
          if [[ ! "$GITHUB_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            printf '%s\n' '::error::workflow identity unavailable'
            exit 1
          fi
          printf 'product_source_sha=%s\nworkflow_GITHUB_SHA=%s\n' "$product_source_sha" "$GITHUB_SHA"
      - name: Closed metadata inventory only (no qualification or engine execution)
        shell: bash
        run: |
          umask 077
          /usr/bin/python3 -I -S -B - <<'PY_METADATA'
          # BEGIN NATIVE_ARM_METADATA_PROGRAM
          import json
          import os
          import re
          import signal
          import stat
          import sys

          STATUS_FIELDS = ("Uid", "CapEff", "CapPrm", "CapInh", "CapAmb", "CapBnd", "NoNewPrivs")
          MARKERS = ("CONTAINER_HOST", "CONTAINER_CONNECTION", "DOCKER_HOST")
          MACHINES = ("aarch64", "arm64", "x86_64", "amd64", "i386", "i686", "armv7l", "riscv64", "ppc64le", "s390x")

          def parse_status(text):
              """Parse only fixed fields; missing, malformed or duplicate fields stay unknown."""
              result = dict.fromkeys(STATUS_FIELDS)
              if not isinstance(text, str) or len(text) > 16384:
                  return result
              seen = set()
              for line in text.splitlines():
                  key, separator, value = line.partition(":")
                  if not separator or key not in result:
                      continue
                  if key in seen:
                      result[key] = None
                      continue
                  seen.add(key)
                  value = value.strip()
                  if key == "Uid":
                      parts = value.split()
                      if len(parts) == 4 and all(re.fullmatch(r"[0-9]{1,10}", part) for part in parts):
                          uids = [int(part) for part in parts]
                          if all(uid < 2**32 for uid in uids):
                              result[key] = uids
                  elif key == "NoNewPrivs":
                      if value in ("0", "1"):
                          result[key] = int(value)
                  elif re.fullmatch(r"[0-9a-fA-F]{16}", value):
                      result[key] = int(value, 16)
              return result

          def parse_elf(header):
              """Interpret the first 64 bytes only; never emit executable bytes or its path."""
              unknown = {"class_bits": None, "endianness": None, "e_machine": None}
              if not isinstance(header, (bytes, bytearray)) or len(header) < 64 or header[:4] != b"\x7fELF":
                  return unknown
              if header[4] not in (1, 2) or header[5] not in (1, 2) or header[6] != 1:
                  return unknown
              endian = "little" if header[5] == 1 else "big"
              size_offset, expected_size = (40, 52) if header[4] == 1 else (52, 64)
              if (int.from_bytes(header[16:18], endian) not in (2, 3)
                      or int.from_bytes(header[20:24], endian) != 1
                      or int.from_bytes(header[size_offset:size_offset + 2], endian) != expected_size):
                  return unknown
              return {"class_bits": 32 if header[4] == 1 else 64, "endianness": endian,
                      "e_machine": int.from_bytes(header[18:20], endian)}

          def caller_observations(status, resuid, sigchld_default, markers, kernel_machine, elf):
              """Pure observations, not admission; status and ELF come from the pure parsers."""
              proc_uids = status["Uid"]
              uid_known = resuid is not None and proc_uids is not None
              marker_known = all(type(markers.get(name)) is bool for name in MARKERS)
              elf_known = all(value is not None for value in elf.values())
              observations = {
                  "getresuid_matches_proc_status": None if not uid_known else list(resuid) == proc_uids[:3],
                  "uids_equal_and_nonroot": None if not uid_known else resuid[0] != 0 and len(set((*resuid, *proc_uids))) == 1,
                  "sigchld_default": sigchld_default,
                  "no_new_privs_set": None if status["NoNewPrivs"] is None else status["NoNewPrivs"] == 1,
                  "remote_engine_markers_absent": None if not marker_known else not any(markers[name] for name in MARKERS),
                  # Agreement cannot establish physical hardware or a usable rootless engine.
                  "kernel_elf_arm64_concordant": None if kernel_machine not in MACHINES or not elf_known else (
                      kernel_machine in ("aarch64", "arm64") and elf["class_bits"] == 64
                      and elf["endianness"] == "little" and elf["e_machine"] == 183),
              }
              for field, name in (("CapEff", "effective_caps_empty"), ("CapPrm", "permitted_caps_empty"),
                                  ("CapInh", "inheritable_caps_empty"), ("CapAmb", "ambient_caps_empty"),
                                  ("CapBnd", "bounding_caps_empty")):
                  observations[name] = None if status[field] is None else status[field] == 0
              return observations

          def read_small_ascii(path, limit):
              try:
                  with open(path, "rb") as stream:
                      value = stream.read(limit + 1)
                  return value.decode("ascii") if len(value) <= limit else None
              except (OSError, UnicodeError):
                  return None

          def tool_metadata(path):
              # lstat only: no target resolution, content reads, execution or version probe.
              result = {"present": None, "regular": None, "owner_uid": None, "mode": None}
              try:
                  info = os.lstat(path)
              except FileNotFoundError:
                  result["present"] = False
              except OSError:
                  pass
              else:
                  result.update(present=True, regular=stat.S_ISREG(info.st_mode),
                                owner_uid=info.st_uid, mode=format(stat.S_IMODE(info.st_mode), "04o"))
              return result

          def collect_metadata():
              status = parse_status(read_small_ascii("/proc/self/status", 16384))
              try:
                  resuid = list(os.getresuid())
              except (AttributeError, OSError):
                  resuid = None
              try:
                  sigchld_default = signal.getsignal(signal.SIGCHLD) == signal.SIG_DFL
              except (AttributeError, OSError, ValueError):
                  sigchld_default = None
              try:
                  machine = os.uname().machine
                  machine = machine if machine in MACHINES else None
              except (AttributeError, OSError):
                  machine = None
              try:
                  with open(os.path.realpath(sys.executable), "rb") as executable:
                      header = executable.read(64)
              except (OSError, TypeError, ValueError):
                  header = None
              elf = parse_elf(header)

              pidfd_outcome = "unsupported"
              if hasattr(os, "pidfd_open"):
                  try:
                      descriptor = os.pidfd_open(os.getpid(), 0)
                  except NotImplementedError:
                      pass
                  except OSError:
                      pidfd_outcome = "open_unavailable"
                  else:
                      try:
                          os.close(descriptor)
                      except OSError:
                          pidfd_outcome = "close_unavailable"
                      else:
                          pidfd_outcome = "opened_and_closed"

              sysctls = {}
              for name, path in (
                  ("kernel.unprivileged_userns_clone", "/proc/sys/kernel/unprivileged_userns_clone"),
                  ("kernel.apparmor_restrict_unprivileged_userns", "/proc/sys/kernel/apparmor_restrict_unprivileged_userns"),
                  ("user.max_user_namespaces", "/proc/sys/user/max_user_namespaces"),
              ):
                  text = read_small_ascii(path, 32)
                  value = None
                  if text is not None and re.fullmatch(r"[0-9]{1,20}", text.strip()):
                      number = int(text.strip())
                      if number < 2**64 and (name == "user.max_user_namespaces" or number in (0, 1)):
                          value = number
                  sysctls[name] = value

              # Membership, not truthiness: even an empty marker is recorded as present.
              markers = {name: name in os.environ for name in MARKERS}
              workflow_sha = os.environ.get("GITHUB_SHA", "")
              workflow_sha = workflow_sha if re.fullmatch(r"[0-9a-fA-F]{40}", workflow_sha) else None
              data = {
                  "qualification_run": False,
                  "product_execution": False,
                  "engine_execution": False,
                  "product_source_sha": "81a266801b11569e6e8873ddebed16eb1d162356",
                  "workflow_github_sha": workflow_sha,
                  "requested_runner_label": "ubuntu-24.04-arm",
                  "sys_platform": sys.platform if sys.platform == "linux" else None,
                  "kernel_machine": machine,
                  "python_version_info": {
                      "major": sys.version_info.major, "minor": sys.version_info.minor,
                      "micro": sys.version_info.micro, "serial": sys.version_info.serial,
                      "releaselevel": sys.version_info.releaselevel if sys.version_info.releaselevel in (
                          "alpha", "beta", "candidate", "final") else None,
                  },
                  "getresuid": resuid,
                  "sigchld_default": sigchld_default,
                  "proc_self_status": status,
                  "python_executable_elf": elf,
                  "self_pidfd_outcome": pidfd_outcome,
                  "sysctls": sysctls,
                  "tool_paths": {path: tool_metadata(path) for path in (
                      "/usr/bin/podman", "/usr/bin/newuidmap", "/usr/bin/newgidmap")},
                  "remote_engine_marker_presence": markers,
                  "observed_prerequisites": caller_observations(status, resuid, sigchld_default, markers, machine, elf),
                  "remaining_checks": {
                      "physical_hardware_provenance": "NOT_RUN", "rootless_engine": "NOT_RUN",
                      "namespaces": "NOT_RUN", "images": "NOT_RUN", "protocol": "NOT_RUN",
                      "minimum_platform_floors": "NOT_RUN",
                  },
              }
              # Availability only, not favorable caller conditions: a refused caller can exit 0.
              essential_known = (
                  workflow_sha is not None and resuid is not None and sigchld_default is not None
                  and machine is not None and data["sys_platform"] is not None
                  and all(value is not None for value in status.values())
                  and all(value is not None for value in elf.values())
              )
              return data, 0 if essential_known else 1

          def main():
              data, result = collect_metadata()
              payload = json.dumps(data, sort_keys=True, separators=(",", ":")) + "\n"
              # No raw exception or path is printed, including on an output failure.
              try:
                  directory = os.environ.get("RUNNER_TEMP")
                  if directory is None or not os.path.isabs(directory):
                      result = 1
                  else:
                      with open(os.path.join(directory, "native-arm-metadata.json"), "x", encoding="ascii") as output:
                          output.write(payload)
              except (OSError, ValueError):
                  result = 1
              sys.stdout.write(payload)
              return result

          if __name__ == "__main__":
              try:
                  result = main()
              except Exception:
                  # Unexpected collection failure: fixed text only, never exception details.
                  sys.stdout.write('{"engine_execution":false,"metadata_error":"unavailable","product_execution":false,"qualification_run":false}\n')
                  result = 1
              raise SystemExit(result)
          # END NATIVE_ARM_METADATA_PROGRAM
          PY_METADATA
      - name: Retain only the safe metadata JSON if present
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-arm-caller-metadata
          path: ${{ runner.temp }}/native-arm-metadata.json
          retention-days: 3
          if-no-files-found: ignore
