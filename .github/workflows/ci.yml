# charmer CI.
#
# fast       every push and pull request: goldens, whitespace, the secret
#            and identifier scan of exactly the new commits, hygiene, import
#            smoke, shell and workflow lint.
# gateway    nightly and on demand: the gateway for this host and its
#            diagnostic probes (tools/build.py, .github/scripts/
#            gateway_probes.py), for the battery.
# battery    nightly and on demand: the full Linux suite (Python 3.11,
#            3.14 and 3.15), bubblewrap 0.12 or later for the isolated
#            classes (built from its pinned release, its version recorded),
#            the candidate gateway and its probes (bound to the build
#            record), the pinned Claude Code, and the pinned setuptools for
#            the distribution tests, which must run; on 3.15 (the bundled
#            runtime's version) also the fast tier under an ISO-8859-1
#            locale with EncodingWarning shown and recorded.
# pty        nightly and on demand: the terminal journeys, one job per OS,
#            run serially on their own.
# nix        nightly and on demand: the flake checks, the Nix gateway bytes
#            compared with the native build, and the product's indirect
#            garbage-collector root in this disposable Nix store.
#
# The nightly schedule runs only while the repository variable
# CM_SCHEDULES is "on" (every job a schedule reaches checks it); a manual
# run is not affected.
#
# Scan policy (fast lane): a pull request scans BASE..HEAD of the pull
# request; a push scans before..after; a push that creates a branch (no
# "before") or rewrites history (its "before" is not in the clone) scans the
# whole history. A pull request whose base or head is missing from the
# clone fails, as does every candidate the scanner reports.
#
# Hardening: actions pinned by commit, no permissions unless a job grants
# them, no privileged pull-request trigger, no credentials kept after
# checkout, umask 077 in every step, no provider calls (the test tripwire
# is always on through tools/test.py), and one secret only: the private
# identifier list of the fast lane's identifier checks, when the repository
# has it.

name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONPATH: src:tests
  # The release integration tests (installer, update, journey, release
  # tool) must run: without ssh-keygen they fail instead of skipping.
  CHARMER_TEST_REQUIRE_RELEASE: "1"

jobs:
  fast:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Goldens are current
        run: |
          umask 077
          python3 tests/bless.py --check
      - name: Revision range (the scan policy above)
        id: range
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          umask 077
          if [ "$EVENT" = pull_request ]; then
            for rev in "$PR_BASE" "$PR_HEAD"; do
              if ! git cat-file -e "$rev^{commit}" 2>/dev/null; then
                echo "::error::the pull request revision $rev is not in the clone"
                exit 1
              fi
            done
            echo "range=$PR_BASE..$PR_HEAD" >>"$GITHUB_OUTPUT"
          elif [ -z "$PUSH_BEFORE" ] || [ "$PUSH_BEFORE" = 0000000000000000000000000000000000000000 ] ||
            ! git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            echo "range=" >>"$GITHUB_OUTPUT"
          else
            echo "range=$PUSH_BEFORE..$PUSH_AFTER" >>"$GITHUB_OUTPUT"
          fi
      - name: Whitespace
        env:
          RANGE: ${{ steps.range.outputs.range }}
        run: |
          umask 077
          if [ -n "$RANGE" ]; then
            git diff --check "${RANGE%%..*}" "${RANGE##*..}"
          else
            git diff --check "$(git hash-object -t tree /dev/null)" HEAD
          fi
      - name: Private identifier list
        # The exact identifiers of the repository's people and computers are
        # not published: an Actions secret, when present, adds them to the
        # scan and the hygiene gates below (a 0600 file the environment
        # names); without it (a fork, a pull request) the generic checks run.
        env:
          PRIVATE_IDENTIFIERS: ${{ secrets.CHARMER_PRIVATE_IDENTIFIERS }}
        run: |
          umask 077
          if [ -n "$PRIVATE_IDENTIFIERS" ]; then
            list="$RUNNER_TEMP/private-identifiers.tsv"
            printf '%s\n' "$PRIVATE_IDENTIFIERS" >"$list"
            chmod 600 "$list"
            echo "CHARMER_PRIVATE_IDENTIFIERS=$list" >>"$GITHUB_ENV"
            echo "private_input=supplied"
          else
            echo "private_input=unavailable; generic checks only"
          fi
      - name: Secret and identifier scan of the new commits
        env:
          RANGE: ${{ steps.range.outputs.range }}
        run: |
          umask 077
          private_input=unavailable
          if [ -n "${CHARMER_PRIVATE_IDENTIFIERS:-}" ]; then
            private_input=supplied
          fi
          status=0
          if [ -n "$RANGE" ]; then
            python3 tools/history_scan.py --repo . --range "$RANGE" >/dev/null 2>&1 || status=$?
          else
            python3 tools/history_scan.py --repo . >/dev/null 2>&1 || status=$?
          fi
          printf 'private_check=history status=%s private_input=%s\n' "$status" "$private_input"
          exit "$status"
      - name: Hygiene
        run: |
          umask 077
          private_input=unavailable
          if [ -n "${CHARMER_PRIVATE_IDENTIFIERS:-}" ]; then
            private_input=supplied
          fi
          status=0
          python3 tools/test.py tests.test_hygiene tests.test_docs_vocabulary tests.test_history_scan >/dev/null 2>&1 || status=$?
          printf 'private_check=hygiene status=%s private_input=%s\n' "$status" "$private_input"
          exit "$status"
      - name: Generated documentation
        run: |
          umask 077
          python3 tools/docs_gen.py --check
      - name: Import smoke
        run: |
          umask 077
          python3 -I -c 'import sys; sys.path.insert(0, "src"); import charmer.cli.entry, charmer.proxy, charmer.trust, charmer.self_update, charmer.release_update, charmer.install_txn'
          python3 bin/charmer --version
      - name: Pinned CI compiler (the gateway's, by hash) and shell linter (by hash)
        run: |
          umask 077
          sh .github/scripts/ci_tools.sh go "$RUNNER_TEMP/ci-go"
          sh .github/scripts/ci_tools.sh shellcheck "$RUNNER_TEMP/ci-shellcheck"
          printf '%s\n' "$RUNNER_TEMP/ci-go/bin" "$RUNNER_TEMP/ci-shellcheck" >>"$GITHUB_PATH"
      - name: Shell lint
        run: |
          umask 077
          shellcheck -s sh packaging/install.sh .github/scripts/journey.sh .github/scripts/wsl_prepare.sh .github/scripts/ci_tools.sh \
            .github/scripts/bubblewrap_floor.sh
      - name: Workflow lint
        run: |
          umask 077
          export GOTOOLCHAIN=local GOPATH="$RUNNER_TEMP/go-tools" GOCACHE="$RUNNER_TEMP/go-build"
          GOBIN="$RUNNER_TEMP/bin" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          go version -m "$RUNNER_TEMP/bin/actionlint"
          "$RUNNER_TEMP/bin/actionlint" -version
          # zizmor by the hash of its manylinux x86_64 wheel (.github/PINS.md),
          # the file the local lint ran. The wheel ships an executable, not a
          # Python module.
          printf '%s\n' 'zizmor==1.31.1 --hash=sha256:58e878eb2dbd2c6183c105e1ac28c14f7dd1eca44a783f1fe2a69647d012c410' >"$RUNNER_TEMP/zizmor.txt"
          python3 -m pip install --disable-pip-version-check --no-deps --only-binary=:all: --require-hashes --target "$RUNNER_TEMP/zizmor" -r "$RUNNER_TEMP/zizmor.txt"
          "$RUNNER_TEMP/zizmor/bin/zizmor" --version
          "$RUNNER_TEMP/bin/actionlint"
          "$RUNNER_TEMP/zizmor/bin/zizmor" --offline .github

  gateway:
    if: (github.event_name == 'schedule' && vars.CM_SCHEDULES == 'on') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: The gateway for this host and its diagnostic probes (from the same prepared tree)
        run: |
          umask 077
          python3 tools/build.py gateway fetch vendor apply build inspect record --target host \
            --work "$RUNNER_TEMP/gateway-work" --dist gateway-dist
          python3 .github/scripts/gateway_probes.py compile --work "$RUNNER_TEMP/gateway-work" \
            --dist gateway-dist --out gateway-probes
      - name: No Claude Code bytes
        run: |
          umask 077
          python3 tools/_build/no_bundle_guard.py gateway-dist gateway-probes
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gateway-dist
          path: gateway-dist
          retention-days: 3
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gateway-probes
          path: gateway-probes
          retention-days: 3
          if-no-files-found: error

  battery:
    needs: gateway
    if: (github.event_name == 'schedule' && vars.CM_SCHEDULES == 'on') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: bubblewrap from its pinned release (by hash, .github/PINS.md) and unprivileged user namespaces
        run: |
          umask 077
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends meson ninja-build pkg-config libcap-dev
          sh .github/scripts/ci_tools.sh bubblewrap "$RUNNER_TEMP/ci-bubblewrap"
          # Root-owned in root-owned directories, as the isolated tests
          # require of the bwrap they run; never setuid.
          sudo install -d -o root -g root -m 0755 /usr/lib/charmer-ci /usr/lib/charmer-ci/bin
          sudo install -o root -g root -m 0755 "$RUNNER_TEMP/ci-bubblewrap/bwrap" /usr/lib/charmer-ci/bin/bwrap
          printf '%s\n' /usr/lib/charmer-ci/bin >>"$GITHUB_PATH"
      - name: The bubblewrap on PATH is 0.12 or later (recorded)
        run: |
          umask 077
          sh .github/scripts/bubblewrap_floor.sh
      - name: The pinned build backend for the distribution tests (by hash, .github/PINS.md)
        run: |
          umask 077
          printf '%s\n' 'setuptools==84.2.1 --hash=sha256:ca140b45d5325a9478f880e351484f62fef15f336462e449ca0c03c873d589c2' >"$RUNNER_TEMP/setuptools.txt"
          python3 -m pip install --disable-pip-version-check --no-deps --only-binary=:all: --require-hashes -r "$RUNNER_TEMP/setuptools.txt"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gateway-dist
          path: ${{ runner.temp }}/gateway-dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gateway-probes
          path: ${{ runner.temp }}/gateway-probes
      - name: The candidate gateway and its diagnostic probes, bound to the build record
        run: |
          umask 077
          python3 .github/scripts/gateway_probes.py provision --dist "$RUNNER_TEMP/gateway-dist" \
            --probes "$RUNNER_TEMP/gateway-probes" >"$RUNNER_TEMP/gateway.env"
          cat "$RUNNER_TEMP/gateway.env"
          cat "$RUNNER_TEMP/gateway.env" >>"$GITHUB_ENV"
      - name: The exact pinned Claude Code (outside the workspace; verified when the runner places it)
        run: |
          umask 077
          url=$(python3 -c 'import sys; sys.path.insert(0, "src"); from charmer import acquire, pin, strict_json; c = strict_json.load("src/charmer/data/catalog/native-contract.json"); print(acquire.download_url(pin.version(c), pin.host_platform()))')
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 -o "$RUNNER_TEMP/claude" "$url"
          chmod 755 "$RUNNER_TEMP/claude"
      - name: ISO-8859-1 locale for the full-suite fixtures
        run: |
          umask 077
          # Full-suite locale fixtures need this on every Python leg, without
          # changing the job's locale. The dedicated 3.15 step reuses it.
          sudo localedef -i en_US -f ISO-8859-1 en_US.ISO-8859-1
      - name: Read-only interpreter for isolated probes
        run: |
          umask 077
          # setup-python's toolcache executable can be group-writable;
          # isolated probes deliberately refuse group/other-writable programs.
          python3 -c 'import os, sys; os.chmod(os.path.realpath(sys.executable), 0o555)'
      - name: Full suite except the terminal journeys (tests skipped for a missing boundary say so; the distribution tests must run)
        env:
          CHARMER_TEST_DIST_GATEWAY: ${{ runner.temp }}/gateway-dist
        run: |
          umask 077
          python3 tools/test.py --tier full --list | grep -v '^tests.test_tui_pty$' >"$RUNNER_TEMP/modules"
          mapfile -t modules <"$RUNNER_TEMP/modules"
          python3 tools/test.py --tier full --verbose --claude "$RUNNER_TEMP/claude" --require 'DistributionTests' "${modules[@]}"
      # The bundled runtime's version under a locale that is neither UTF-8
      # nor C. -X warn_default_encoding reports every implicit text
      # encoding in the runner's process (where the tests import the
      # launcher); the warnings go to a file of their own (tests that
      # check stderr stay unaffected) and are recorded, they do not fail
      # the step. The terminal journeys expect a UTF-8 terminal: they run
      # in the full suite above and in the pty lane.
      - name: The fast tier under ISO-8859-1 with EncodingWarning (CPython 3.15)
        if: matrix.python == '3.15'
        timeout-minutes: 60
        env:
          CHARMER_TEST_KEYED_LANE: unit
        run: |
          umask 077
          export LANG=en_US.ISO-8859-1 LC_ALL=en_US.ISO-8859-1
          python3 -c 'import locale, sys; e = locale.getencoding(); print(f"locale encoding {e}, UTF-8 mode {sys.flags.utf8_mode}"); sys.exit(None if e.replace("-", "").lower() == "iso88591" else "the locale is not ISO-8859-1")'
          python3 tools/test.py --tier fast --list | grep -v -E '^tests\.test_tui_(input_)?pty$' >"$RUNNER_TEMP/locale-modules"
          mapfile -t modules <"$RUNNER_TEMP/locale-modules"
          status=0
          python3 -X warn_default_encoding -c 'import runpy, sys, warnings; log = open(sys.argv[1], "a", encoding="utf-8"); warnings.showwarning = lambda message, category, filename, lineno, file=None, line=None: log.write(warnings.formatwarning(message, category, filename, lineno, line)); sys.argv = sys.argv[2:]; runpy.run_path(sys.argv[0], run_name="__main__")' \
            "$RUNNER_TEMP/encoding-warnings.log" tools/test.py --tier fast --claude "$RUNNER_TEMP/claude" "${modules[@]}" || status=$?
          touch "$RUNNER_TEMP/encoding-warnings.log"
          grep -o '^[^ ]*: EncodingWarning' "$RUNNER_TEMP/encoding-warnings.log" | sed "s|^$PWD/||" | sort | uniq -c | sort -rn >"$RUNNER_TEMP/encoding-warnings.txt" || true
          printf 'EncodingWarning sites under ISO-8859-1: %s\n' "$(wc -l <"$RUNNER_TEMP/encoding-warnings.txt")" | tee -a "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/encoding-warnings.txt"
          exit "$status"
      - name: No Claude Code bytes in the workspace
        if: always()
        run: |
          umask 077
          rm -f "$RUNNER_TEMP/claude"
          python3 tools/_build/no_bundle_guard.py .

  pty:
    # Load-sensitive terminal journeys: their own job, one runner at a time.
    if: (github.event_name == 'schedule' && vars.CM_SCHEDULES == 'on') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Terminal journeys, serially
        timeout-minutes: 20
        run: |
          umask 077
          python3 tools/test.py tests.test_tui_pty

  nix:
    if: (github.event_name == 'schedule' && vars.CM_SCHEDULES == 'on') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Flake checks (the sandbox suite)
        run: |
          umask 077
          nix build --no-link -L .#checks.x86_64-linux.charmer
      - name: Nix and native gateway bytes are identical
        run: |
          umask 077
          nix_out=$(nix build --no-link --print-out-paths .#gateway-linux-amd64)
          python3 tools/build.py gateway --target linux-amd64 --dist "$RUNNER_TEMP/native"
          cmp "$nix_out/bin/cli-proxy-api" "$RUNNER_TEMP/native/linux-amd64/cli-proxy-api"
      - name: The product's indirect garbage-collector root in this disposable Nix store
        run: |
          umask 077
          package=$(nix build --no-link --print-out-paths .#charmer)
          python3 .github/scripts/nix_roots.py "$package"
