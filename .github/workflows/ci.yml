# Diagnostic branch only: never merge this replacement into the product.
# One native observation, not product acceptance and not a retry workflow.
name: macOS controlling-terminal diagnostic (not acceptance)

on:
  workflow_dispatch:

permissions: {}

jobs:
  controlling-terminal:
    runs-on: macos-15
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"
          architecture: arm64
      - name: Limited OS, image, interpreter and ncurses metadata
        run: |
          umask 077
          python3 - <<'PY'
          import curses
          import json
          import os
          import platform
          import sys
          print(json.dumps({
              "macos": platform.mac_ver()[0],
              "kernel": platform.release(),
              "arch": platform.machine(),
              "image_os": os.environ.get("ImageOS"),
              "image_version": os.environ.get("ImageVersion"),
              "python": platform.python_version(),
              "ncurses": list(getattr(curses, "ncurses_version", ())),
          }, sort_keys=True), flush=True)
          if (sys.platform != "darwin" or platform.machine() != "arm64"
                  or sys.version_info[:3] != (3, 14, 7)):
              raise SystemExit("diagnostic requires macOS arm64 and Python 3.14.7")
          PY
      - name: One controlling-terminal case, unchanged native input path
        run: |
          umask 077
          python3 tools/test.py tests.test_tui_pty \
            -k test_capable_terminal_card_routes_to_controlling_terminal \
            --require test_capable_terminal_card_routes_to_controlling_terminal \
            --max-skip-ratio 0 --keep -v
