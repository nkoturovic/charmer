# Diagnostic branch only: never merge this replacement into the product.
# Qualification-only observation, not product acceptance or a retry workflow.
name: Darwin qualification diagnostic (not acceptance)

on:
  workflow_dispatch:

permissions: {}

jobs:
  darwin-qualification:
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15.0"
          architecture: arm64
      - name: Limited OS, image and interpreter metadata
        run: |
          umask 077
          python3 -I -B - <<'PY'
          import json
          import os
          import platform
          import sys

          print(json.dumps({
              "os": platform.system(),
              "macos": platform.mac_ver()[0],
              "kernel": platform.release(),
              "arch": platform.machine(),
              "image_os": os.environ.get("ImageOS"),
              "image_version": os.environ.get("ImageVersion"),
              "python": platform.python_version(),
              "executable": sys.executable,
              "realpath": os.path.realpath(sys.executable),
          }, sort_keys=True), flush=True)
          if (sys.platform != "darwin" or platform.machine() != "arm64"
                  or sys.version_info != (3, 15, 0, "final", 0)):
              raise SystemExit("diagnostic requires Darwin arm64 and Python 3.15.0 final")
          PY
      - name: One qualification-only run, no product execution
        run: |
          umask 077
          python3 -I -B .github/scripts/darwin_journey_isolation.py \
            --out "$RUNNER_TEMP/darwin-qualification-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --qualify-only
      - name: Bounded byte-exact evidence capture, not acceptance
        if: always()
        run: |
          umask 077
          python3 -I -B - "$RUNNER_TEMP/darwin-qualification-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" <<'PY'
          import base64
          import hashlib
          import json
          import os
          import stat
          import sys

          failed = False
          for filename in ("qualification.json", "network.sb", "controls.py"):
              record = {"filename": filename, "size": None, "sha256": None, "base64": None}
              try:
                  # Nonblocking open lets the regular-file check refuse a FIFO without waiting.
                  descriptor = os.open(os.path.join(sys.argv[1], filename),
                                       os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
                  try:
                      info = os.fstat(descriptor)
                      if not stat.S_ISREG(info.st_mode):
                          record["status"] = "not-regular"
                          failed = True
                      else:
                          with os.fdopen(descriptor, "rb", closefd=False) as source:
                              data = source.read(65536 + 1)
                          record["size"] = info.st_size
                          if len(data) > 65536:
                              record["status"] = "oversize"
                              failed = True
                          else:
                              record.update(status="captured", size=len(data),
                                            sha256=hashlib.sha256(data).hexdigest(),
                                            base64=base64.b64encode(data).decode("ascii"))
                  finally:
                      os.close(descriptor)
              except FileNotFoundError:
                  # Missing optional files are incomplete evidence, never passing controls.
                  record["status"] = "missing"
                  if filename == "qualification.json":
                      failed = True
              except OSError:
                  record["status"] = "unreadable"
                  failed = True
              print(json.dumps(record, sort_keys=True), flush=True)
          raise SystemExit(1 if failed else 0)
          PY
