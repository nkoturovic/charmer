# The charmer Python package: the launcher, its runtime resources and
# its documents. The package is a component and the contributor's interface
# (an editable install for development); the complete product is the release
# bundle or the Nix package, which also carry the gateway.
#
# The version comes from src/charmer/data/version.json (the one version
# authority) through charmer.PACKAGE_VERSION, its PEP 440 form:
# X.Y.Z-dev becomes X.Y.Z.dev0.

[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "charmer"
dynamic = ["version"]
description = "A durable multi-model launcher for Claude Code"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
]

[project.scripts]
charmer = "charmer.entrypoints:charmer"
charmer-proxy = "charmer.entrypoints:charmer_proxy"
charmer-dev = "charmer.entrypoints:charmer_dev"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = false

[tool.setuptools.dynamic]
version = { attr = "charmer.PACKAGE_VERSION" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["charmer", "charmer.*"]

[tool.setuptools.package-data]
# Every runtime resource under the package's data directory.
charmer = ["data/**/*"]

[tool.setuptools.data-files]
# The installed documents: every page under docs/, at its relative path (a
# key per directory), so links between pages resolve the same in a checkout
# and in every installation. The help pointers name the three manuals at the
# top (charmer.layout.document).
"share/charmer" = [
    "docs/USAGE.md", "docs/CHEATSHEET.md", "docs/STANDALONE.md",
    "docs/quickstart.md", "docs/troubleshooting.md", "docs/update.md", "docs/uninstall.md",
    "docs/privacy.md", "docs/security.md",
]
"share/charmer/install" = [
    "docs/install/linux.md", "docs/install/macos.md", "docs/install/windows-wsl2.md", "docs/install/nix.md",
]
"share/charmer/providers" = [
    "docs/providers/api-keys.md", "docs/providers/openrouter.md", "docs/providers/claude-account.md",
    "docs/providers/chatgpt-account.md", "docs/providers/anthropic-compatible.md",
    "docs/providers/openai-compatible.md", "docs/providers/lan.md",
]
"share/charmer/guides" = [
    "docs/guides/profiles.md", "docs/guides/models.md", "docs/guides/sessions.md", "docs/guides/lineup.md",
    "docs/guides/gateway.md", "docs/guides/networking.md", "docs/guides/move-machines.md",
    "docs/guides/legacy-migration.md",
]
"share/charmer/reference" = [
    "docs/reference/cli.md", "docs/reference/tasks.md", "docs/reference/settings.md",
    "docs/reference/compatibility.md", "docs/reference/licenses.md",
]
