host: "127.0.0.1"
port: 8317
tls:
  enable: false
  cert: ""
  key: ""
remote-management:
  allow-remote: false
  secret-key: ""
  disable-control-panel: true
  disable-auto-update-panel: true
auth-dir: "/fixture/home/.local/share/charmer/auth"
api-keys:
  - "tttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttt"
debug: false
pprof:
