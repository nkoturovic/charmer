          levels:
            - "medium"
        force-mapping: true
  - name: "charmer-render"
    base-url: "http://127.0.0.1:9/v1"
    models:
      - name: "charmer-render"
        alias: "charmer-render-596c4541"
        force-mapping: true
payload:
  override:
    - models:
        - name: "charmer-kimi-k3"
          protocol: "claude"
      params:
        "output_config.effort": "max"
    - models:
        - name: "gpt-multi-gpt55-high"
          protocol: "codex"
        - name: "gpt-multi-sol-high"
          protocol: "codex"
      params:
        "reasoning.effort": "high"
    - models:
        - name: "gpt-multi-sol-xhigh"
          protocol: "codex"
      params:
        "reasoning.effort": "xhigh"
    - models:
