openai-compatibility:
  - name: "chatco"
    base-url: "https://api.chatco.example/v1"
    api-key-entries:
      - api-key: "golden-dummy-chatco-api-key"
    headers:
      X-Client: "charmer"
    models:
      - name: "chatco-chat-1"
        alias: "custom-chatco-chat"
        display-name: "Chat Co chat"
        max-context-length: 131072
        thinking:
          levels:
            - "low"
            - "high"
            - "max"
        force-mapping: true
      - name: "chatco-old-1"
        alias: "custom-chatco-old"
        display-name: "Chat Co old"
        max-context-length: 65536
        thinking:
          levels:
            - "medium"
        force-mapping: true
  - name: "lanbox"
    base-url: "http://box.lan:8010/v1"
    models:
      - name: "lan-model"
